source=~/.config/hypr/hyprlock/colors.conf

background {
    color = rgba(1a1a2eFF)
}

input-field {
    monitor =
    size = 280, 45
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = $accent_color
    inner_color = $entry_background_color
    font_color = $entry_color
    fade_on_empty = true
    placeholder_text = <span foreground="##999999">Password</span>

    position = 0, -80
    halign = center
    valign = center
}

label { # Clock
    monitor =
    text = $TIME24
    color = $text_color
    font_size = 72
    font_family = $font_family_clock

    position = 0, 80
    halign = center
    valign = center
}

label { # Date
    monitor =
    text = cmd[update:5000] date +"%A, %B %d"
    color = $text_secondary_color
    font_size = 18
    font_family = $font_family_clock

    position = 0, 20
    halign = center
    valign = center
}

label { # User
    monitor =
    text = 󰣇  $USER
    color = $text_color
    font_size = 16
    font_family = $font_family

    position = 0, 140
    halign = center
    valign = center
}

label { # Caps Lock Warning
    monitor =
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check-capslock.sh
    color = $error_color
    font_size = 13
    font_family = $font_family
    position = 0, -120
    halign = center
    valign = center
}

label { # Status
    monitor =
    text = cmd[update:5000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/status.sh
    color = $text_secondary_color
    font_size = 12
    font_family = $font_family

    position = 30, 30
    halign = left
    valign = top
}
